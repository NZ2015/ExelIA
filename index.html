<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Excel AI</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body>

<div class="container">
    <h1>Excel AI</h1>

    <div class="grid">
        <div class="panel">
            <!-- Theme controls: allow user to toggle light/dark and pick colors -->
            <div class="theme-controls" id="themeControls">
              <div class="theme-row theme-toggle">
                <label>Thème</label>
                <div id="themeToggle" class="toggle-switch" title="Basculer clair/sombre">
                  <div class="toggle-knob"></div>
                </div>
                <small class="helper" style="margin-left:8px;">Clair / Sombre</small>
              </div>

              <div class="theme-row">
                <label for="colorAccentBlue">Accent bleu</label>
                <input id="colorAccentBlue" type="color" value="#0ea5e9">
              </div>

              <div class="theme-row">
                <label for="colorAccentGreen">Accent vert</label>
                <input id="colorAccentGreen" type="color" value="#10b981">
              </div>

              <div class="theme-row">
                <label for="colorBg">Couleur fond</label>
                <input id="colorBg" type="color" value="#071023">
              </div>

              <div class="theme-row">
                <label for="colorText">Couleur texte</label>
                <input id="colorText" type="color" value="#e6eef6">
              </div>

              <div class="theme-row">
                <button id="resetThemeBtn" class="btn secondary" style="margin-top:6px;">Réinitialiser thème</button>
              </div>
            </div>

            <div class="file-drop">
                <label for="excelFile" style="cursor:pointer; display:block; font-weight:bold;">Choisir un fichier Excel</label>
                <input type="file" id="excelFile" accept=".xlsx,.xls">
            </div>

            <button id="analyzeBtn" class="btn">Analyser</button>
            <button id="downloadBtn" class="btn secondary">Télécharger</button>

            <div class="chat">
                <h2 style="margin: 16px 0 8px; font-size: 16px;">Question rapide</h2>
                <div id="chatMessages" class="chat-messages">
                    <div>Posez une question sur les données.</div>
                </div>
                <div class="chat-input">
                    <input type="text" id="chatInput" placeholder="Ex: quelles sont les anomalies ?">
                    <button id="sendChatBtn" class="btn">Envoyer</button>
                </div>
            </div>
        </div>

        <div class="results">
            <div class="section">
                <h2>Résumé</h2>
                <div id="summary" class="summary">Aucun résumé pour l’instant.</div>
            </div>

            <div class="section">
                <h2>Tendances</h2>
                <ul id="trends"></ul>
            </div>

            <div class="section">
                <h2>Anomalies</h2>
                <table class="table" id="anomaliesTable">
                    <thead>
                        <tr>
                            <th>Colonne</th>
                            <th>Ligne</th>
                            <th>Valeur</th>
                            <th>Score</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <div class="section">
                <h2>Graphique</h2>
                <div class="chart-wrap">
                    <canvas id="chart"></canvas>
                </div>
            </div>

            <div class="section">
                <h2>Suggestions</h2>
                <ul id="suggestions"></ul>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
